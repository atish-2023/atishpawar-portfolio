<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 relative overflow-hidden px-4 py-8 sm:px-6">
  <!-- Animated gradient blobs -->
  <div class="absolute inset-0 -z-10 overflow-hidden">
    <div class="absolute top-1/4 left-1/4 w-64 h-64 bg-blue-500 rounded-full mix-blend-soft-light blur-3xl opacity-25 animate-blob"></div>
    <div class="absolute top-1/3 right-1/4 w-72 h-72 bg-purple-500 rounded-full mix-blend-soft-light blur-3xl opacity-25 animate-blob animation-delay-2000"></div>
    <div class="absolute bottom-1/4 left-1/3 w-64 h-64 bg-pink-500 rounded-full mix-blend-soft-light blur-3xl opacity-25 animate-blob animation-delay-4000"></div>
  </div>

  <!-- Login card - larger and more balanced -->
  <div class="w-full max-w-md bg-white/10 backdrop-blur-2xl border border-white/20 rounded-2xl shadow-2xl p-8 transition-all duration-300 hover:shadow-blue-500/20 sm:p-10 md:p-12 md:max-w-lg">
    <div class="text-center mb-8 md:mb-10">
      <h1 class="text-3xl font-bold text-white mb-2 md:text-4xl">
        Admin Login
      </h1>
      <p class="text-gray-300 text-sm md:text-base">
        Sign in to access the admin dashboard
      </p>
    </div>

    <!-- Error message display -->
    <div *ngIf="errorMessage" class="mb-6 p-4 rounded-lg bg-red-900/50 border border-red-700/50 text-red-200 text-sm md:text-base">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm" class="space-y-5 md:space-y-6">
      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-300 mb-2 md:text-base">Email Address</label>
        <div class="relative">
          <input
            id="email"
            name="email"
            type="email"
            [(ngModel)]="loginData.email"
            required
            #email="ngModel"
            class="block w-full pl-10 pr-4 py-3 rounded-xl bg-gray-900/60 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-300 md:py-4 md:text-base"
            placeholder="you@example.com"
            [disabled]="isLoading"
          />
          <svg
            class="absolute left-3 top-3.5 h-5 w-5 text-gray-500 md:top-4 md:left-3"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
        </div>
        <div *ngIf="email.invalid && email.touched" class="mt-1 text-sm text-red-400 md:text-base">
          Email is required
        </div>
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-300 mb-2 md:text-base">Password</label>
        <div class="relative">
          <input
            id="password"
            name="password"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="loginData.password"
            required
            #password="ngModel"
            class="block w-full pl-10 pr-12 py-3 rounded-xl bg-gray-900/60 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all duration-300 md:py-4 md:text-base"
            placeholder="••••••••"
            [disabled]="isLoading"
          />
          <svg
            class="absolute left-3 top-3.5 h-5 w-5 text-gray-500 md:top-4 md:left-3"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
          <!-- Eye icon for show/hide password -->
          <button
            type="button"
            (click)="togglePasswordVisibility()"
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-gray-300 focus:outline-none"
            [disabled]="isLoading"
          >
            <svg
              *ngIf="!showPassword"
              class="h-5 w-5 transition-all duration-200"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <svg
              *ngIf="showPassword"
              class="h-5 w-5 transition-all duration-200"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
            </svg>
          </button>
        </div>
        <div *ngIf="password.invalid && password.touched" class="mt-1 text-sm text-red-400 md:text-base">
          Password is required
        </div>
      </div>

      <!-- Remember Me / Forgot -->
      <div class="flex items-center justify-between text-sm md:text-base">
        <label class="flex items-center text-gray-400">
          <input type="checkbox" [(ngModel)]="loginData.rememberMe" name="rememberMe" class="h-4 w-4 text-blue-600 rounded bg-gray-800 border-gray-600 focus:ring-blue-500 md:h-5 md:w-5" [disabled]="isLoading" />
          <span class="ml-2 md:ml-3">Remember me</span>
        </label>
        <a href="#" class="text-blue-400 hover:text-blue-300 transition-colors">Forgot password?</a>
      </div>

      <!-- Login button with loading spinner -->
      <button
        type="submit"
        [disabled]="loginForm.invalid || isLoading"
        class="w-full py-3 rounded-xl text-white font-medium text-base bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 hover:opacity-90 transition-all duration-300 transform hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed md:py-4 md:text-lg flex items-center justify-center"
      >
        <span *ngIf="isLoading" class="inline-block h-5 w-5 animate-spin mr-2 rounded-full border-2 border-solid border-white border-r-transparent align-[-0.125em]"></span>
        <span *ngIf="isLoading">Signing in...</span>
        <span *ngIf="!isLoading">Sign In</span>
      </button>
    </form>
  </div>
</div>
