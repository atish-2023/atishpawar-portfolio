<!-- Loading State -->
<div *ngIf="loading" class="flex justify-center items-center py-20">
  <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div>
  <span class="ml-3 text-slate-300">Loading education data...</span>
</div>

<!-- Error State -->
<div *ngIf="!loading && error" class="py-20 text-center">
  <div class="bg-red-900/50 border border-red-700 rounded-xl p-6 max-w-2xl mx-auto">
    <div class="flex items-center justify-center mb-4">
      <svg class="w-8 h-8 text-red-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      <h3 class="text-xl font-bold text-red-400">Error Loading Data</h3>
    </div>
    <p class="text-slate-300 mb-4">{{ error }}</p>
    <button (click)="loadData()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition duration-300">
      Retry
    </button>
  </div>
</div>

<!-- Content State -->
<section id="education" class="py-24 relative overflow-hidden" *ngIf="!loading && !error">
  <!-- Dark-themed background gradient -->
  <div class="absolute inset-0 bg-gradient-to-br from-slate-900 via-indigo-900 to-slate-800"></div>
  <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,rgba(99,102,241,0.1)_0%,rgba(0,0,0,0)_70%)]"></div>
  
  <div class="container mx-auto px-4 relative z-10">
    <div class="text-center mb-16 animate-fade-in-up">
      <h2 class="text-3xl md:text-4xl font-bold mb-4 section-heading">
        <span class="bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">Education</span>
      </h2>
    </div>
    
    <div class="max-w-5xl mx-auto">
      <div class="relative">
        <!-- Glowing timeline line with gradient - visible only on desktop (1024px and above) -->
        <div class="absolute left-1/2 transform -translate-x-1/2 h-full w-0.5 bg-gradient-to-b from-blue-500 via-purple-500 to-pink-500 shadow-lg shadow-blue-500/30 hidden lg:block"></div>
        
        <div class="space-y-12">
          <app-timeline-item 
            *ngFor="let education of educations; let i = index"
            [item]="education"
            class="animate-fade-in-up"
            [style.animation-delay]="i * 150 + 'ms'">
          </app-timeline-item>
        </div>
      </div>
    </div>
  </div>
</section>
