<!-- Loading State -->
<div *ngIf="loading" class="flex justify-center items-center py-20">
  <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div>
  <span class="ml-3 text-slate-300">Loading projects...</span>
</div>

<!-- Error State -->
<div *ngIf="!loading && error" class="py-20 text-center">
  <div class="bg-red-900/50 border border-red-700 rounded-xl p-6 max-w-2xl mx-auto">
    <div class="flex items-center justify-center mb-4">
      <svg class="w-8 h-8 text-red-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      <h3 class="text-xl font-bold text-red-400">Error Loading Data</h3>
    </div>
    <p class="text-slate-300 mb-4">{{ error }}</p>
    <button (click)="loadData()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition duration-300">
      Retry
    </button>
  </div>
</div>

<!-- Content State -->
<section id="projects" class="py-20 section-bg" *ngIf="!loading && !error">
    <div class="container mx-auto px-4">
        <div class="text-center mb-16">
            <h2 class="text-3xl md:text-4xl font-bold text-white mb-4 section-heading">Projects</h2>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div *ngFor="let project of projects; let i = index" 
                 style="border: 2px solid #4caf50; background: rgba(76, 175, 80, 0.1);"
                 class="project-wrapper">
                <app-project-card [project]="project"></app-project-card>
            </div>
        </div>
        <div class="mt-12 text-center">
            <a href="#" class="inline-block bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg hover:shadow-xl transition duration-300 transform hover:-translate-y-1">
                View All Projects
            </a>
        </div>
    </div>
</section>
