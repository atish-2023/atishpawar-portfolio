<section id="projects" class="py-20 section-bg">
    <div class="container mx-auto px-4">
        <div class="text-center mb-16">
            <h2 class="text-3xl md:text-4xl font-bold text-white mb-4">Projects</h2>
            <div class="w-20 h-1 bg-gradient-to-r from-blue-500 to-purple-500 mx-auto rounded-full"></div>
            <p class="mt-6 text-xl text-slate-300 max-w-3xl mx-auto">
                Explore my latest projects and see how I've brought ideas to life
            </p>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <app-project-card 
                *ngFor="let project of projects; let i = index" 
                [project]="project"
                class="animate-on-scroll opacity-0 translate-y-5 transition-all duration-500"
                [style.animation-delay]="i * 100 + 'ms'">
            </app-project-card>
        </div>
        <div class="mt-12 text-center">
            <a href="#" class="inline-block bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg hover:shadow-xl transition duration-300 transform hover:-translate-y-1">
                View All Projects
            </a>
        </div>
    </div>
</section>
