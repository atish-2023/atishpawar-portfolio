<div class="glassmorphism-enhanced h-full flex flex-col">
  <!-- Review Content -->
  <div class="flex-grow">
    <!-- Star Rating -->
    <div class="star-rating">
      <svg *ngFor="let star of getStars(review.rating); let i = index" 
           class="star" 
           [ngClass]="star ? 'filled' : 'empty'"
           viewBox="0 0 24 24">
        <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
      </svg>
    </div>
    
    <!-- Review Message -->
    <p class="review-message">"{{ review.message }}"</p>
  </div>
  
  <!-- Reviewer Info -->
  <div class="reviewer-info">
    <img [src]="review.image" [alt]="review.name" class="reviewer-image">
    <div class="reviewer-details">
      <h4 class="reviewer-name">{{ review.name }}</h4>
      <p class="reviewer-role">{{ review.role }}</p>
      <div class="reviewer-meta">
        <span *ngIf="review.company">{{ review.company }} •</span>
        <span class="ml-1">{{ review.date }}</span>
      </div>
    </div>
  </div>
</div>
