<section id="skills" class="py-20 bg-slate-900">
  <app-section-wrapper 
    title="Skills & Expertise" 
    subtitle="My technical skills and expertise across various domains"
    backgroundColor="slate-900">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <app-skill-chip 
        *ngFor="let skill of skills" 
        [skill]="skill"
        class="transform transition-all duration-300 hover:-translate-y-2">
      </app-skill-chip>
    </div>
    
    <div class="mt-12 text-center">
      <a href="#" 
         class="inline-flex items-center text-secondary hover:text-primary font-bold group">
        View all skills
        <svg class="w-4 h-4 ml-2 group-hover:translate-x-1 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
        </svg>
      </a>
    </div>
  </app-section-wrapper>
</section>
