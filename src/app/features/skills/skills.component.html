<!-- Loading State -->
<div *ngIf="loading" class="flex justify-center items-center py-20">
  <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div>
  <span class="ml-3 text-slate-300">Loading skills...</span>
</div>

<!-- Error State -->
<div *ngIf="!loading && error" class="py-20 text-center">
  <div class="bg-red-900/50 border border-red-700 rounded-xl p-6 max-w-2xl mx-auto">
    <div class="flex items-center justify-center mb-4">
      <svg class="w-8 h-8 text-red-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      <h3 class="text-xl font-bold text-red-400">Error Loading Data</h3>
    </div>
    <p class="text-slate-300 mb-4">{{ error }}</p>
    <button (click)="loadData()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition duration-300">
      Retry
    </button>
  </div>
</div>

<!-- Content State -->
<section id="skills" class="py-20 relative overflow-hidden" *ngIf="!loading && !error">
  <!-- Animated background with gradient and glass effect -->
  <div class="absolute inset-0 bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900"></div>
  <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,rgba(56,189,248,0.1)_0%,rgba(0,0,0,0)_70%)]"></div>
  
  <div class="container mx-auto px-4 relative z-10">
    <div class="text-center mb-16 animate-fade-in-up">
      <h2 class="text-4xl md:text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-purple-400 to-cyan-400 mb-4 section-heading">
        Skills & Expertise
      </h2>
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
      <app-skill-chip 
        *ngFor="let skill of skills; let i = index"
        [skill]="skill"
        class="animate-fade-in-up opacity-0 translate-y-5 transition-all duration-500"
        [style.animation-delay]="i * 100 + 'ms'">
      </app-skill-chip>
    </div>
  </div>
</section>
