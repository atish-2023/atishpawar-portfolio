<section id="experience" class="py-20 bg-slate-900">
  <app-section-wrapper 
    title="Work Experience" 
    subtitle="My professional journey and the roles that shaped my expertise"
    backgroundColor="slate-900">
    <div class="max-w-4xl mx-auto">
      <div class="relative">
        <!-- Timeline line -->
        <div class="absolute left-1/2 transform -translate-x-1/2 h-full w-0.5 bg-gradient-to-b from-primary/50 to-secondary/50"></div>
        
        <div class="space-y-12">
          <app-timeline-item 
            *ngFor="let item of experienceItems; let i = index" 
            [item]="item">
          </app-timeline-item>
        </div>
      </div>
    </div>
  </app-section-wrapper>
</section>
