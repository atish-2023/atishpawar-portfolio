<section id="about" class="py-20 relative overflow-hidden" *ngIf="aboutSection">
  <!-- Dark elegant background with smooth gradient transitions -->
  <div class="absolute inset-0 bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900"></div>
  <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,rgba(56,189,248,0.1)_0%,rgba(0,0,0,0)_70%)]"></div>
  
  <div class="container mx-auto px-4 relative z-10">
    <div class="text-center mb-16 animate-fade-in-up">
      <h2 class="text-3xl md:text-4xl font-bold mb-4">
        <span class="bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">{{ aboutSection.title }}</span>
      </h2>
      <div class="w-24 h-1 bg-gradient-to-r from-blue-500 via-purple-500 to-cyan-500 mx-auto rounded-full"></div>
    </div>
    
    <div class="flex flex-col lg:flex-row gap-12 items-center">
      <!-- Profile Image with Modern Glowing Gradient Border -->
      <div class="lg:w-1/3 flex justify-center animate-fade-in-up" style="animation-delay: 100ms;">
        <div class="relative group">
          <!-- Glowing gradient border effect -->
          <div class="absolute -inset-0.5 bg-gradient-to-r from-blue-500 via-purple-500 to-cyan-500 rounded-2xl blur opacity-70 group-hover:opacity-100 transition-opacity duration-500"></div>
          
          <!-- Glassmorphism container -->
          <div class="relative bg-white/5 backdrop-blur-xl border border-slate-700/40 rounded-2xl p-1 shadow-xl hover:shadow-2xl transition-all duration-500 transform hover:scale-105">
            <div class="bg-gradient-to-br from-slate-700 to-slate-800 rounded-2xl w-64 h-64 md:w-80 md:h-80 flex items-center justify-center overflow-hidden">
              <!-- Profile image -->
              <img [src]="aboutSection.profilePhotoUrl" alt="Profile Photo" class="w-full h-full object-cover rounded-2xl">
            </div>
          </div>
        </div>
      </div>
      
      <!-- Text Content with Glassmorphism Effect -->
      <div class="lg:w-2/3 animate-fade-in-up" style="animation-delay: 200ms;">
        <div class="glassmorphism-dark rounded-2xl p-8 shadow-xl hover:shadow-2xl transition-all duration-500">
          <h3 class="text-2xl font-bold mb-6">
            <span class="bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">Crafting Digital Experiences</span>
          </h3>
          
          <p class="text-lg text-slate-300 mb-6 leading-relaxed">
            {{ aboutSection.content }}
          </p>
          
          <!-- Key Highlights -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <div *ngFor="let skill of aboutSection.skills" class="flex items-center p-3 rounded-xl bg-white/5 backdrop-blur-sm border border-slate-700/30 hover:border-blue-500/50 transition-all duration-300">
              <div class="flex-shrink-0 bg-gradient-to-r from-blue-500/20 to-purple-500/20 p-2 rounded-lg mr-3 border border-blue-500/30">
                <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
              </div>
              <div>
                <div class="text-slate-200 font-medium">{{ skill.name }}</div>
                <div class="text-slate-400 text-sm">{{ skill.description }}</div>
              </div>
            </div>
          </div>
          
          <!-- Skill Badges -->
          <div class="flex flex-wrap gap-3">
            <span class="bg-gradient-to-r from-blue-500/20 to-purple-500/20 text-blue-200 px-4 py-2 rounded-full font-medium border border-blue-500/30 hover:from-blue-500/30 hover:to-purple-500/30 transition-all duration-300 shadow-lg">
              {{ aboutSection.stats.experience }}
            </span>
            <span class="bg-gradient-to-r from-blue-500/20 to-purple-500/20 text-blue-200 px-4 py-2 rounded-full font-medium border border-blue-500/30 hover:from-blue-500/30 hover:to-purple-500/30 transition-all duration-300 shadow-lg">
              {{ aboutSection.stats.projects }}
            </span>
            <span class="bg-gradient-to-r from-blue-500/20 to-purple-500/20 text-blue-200 px-4 py-2 rounded-full font-medium border border-blue-500/30 hover:from-blue-500/30 hover:to-purple-500/30 transition-all duration-300 shadow-lg">
              {{ aboutSection.stats.satisfaction }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
