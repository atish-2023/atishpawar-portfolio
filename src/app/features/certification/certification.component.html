<section class="py-20 relative overflow-hidden">
  <!-- Dark gradient background -->
  <div class="absolute inset-0 bg-gradient-to-br from-slate-900 via-indigo-900 to-slate-800"></div>
  <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,rgba(99,102,241,0.1)_0%,rgba(0,0,0,0)_70%)]"></div>
  
  <div class="container mx-auto px-4 relative z-10">
    <!-- Section Heading -->
    <div class="text-center mb-16 animate-fade-in-up">
      <h2 class="text-3xl md:text-4xl font-bold mb-4">
        <span class="bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">Certifications & Achievements</span>
      </h2>
      <div class="w-24 h-1 bg-gradient-to-r from-blue-500 via-purple-500 to-cyan-500 mx-auto rounded-full mb-6"></div>
      <p class="mt-6 text-xl text-slate-300 max-w-3xl mx-auto leading-relaxed">
        My professional certifications and key achievements that validate my expertise
      </p>
    </div>
    
    <!-- Certifications Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <div 
        *ngFor="let cert of certifications; let i = index" 
        class="certification-card glassmorphism rounded-2xl p-6 border border-white/10 transition-all duration-500 hover:scale-105 hover:shadow-xl hover:shadow-blue-500/20 animate-fade-in-up"
        [style.animation-delay]="i * 150 + 'ms'">
        <div class="flex items-start mb-6">
          <!-- Certificate Logo -->
          <div class="flex-shrink-0 bg-gradient-to-br from-blue-500/20 to-purple-500/20 p-3 rounded-xl mr-4 border border-blue-500/30">
            <img [src]="cert.logo" [alt]="cert.organization" class="w-12 h-12 object-contain">
          </div>
          <div>
            <h3 class="text-xl font-bold text-white">{{ cert.title }}</h3>
            <p class="text-indigo-300 font-medium">{{ cert.organization }}</p>
            <span class="text-sm text-slate-400">{{ cert.date }}</span>
          </div>
        </div>
        
        <p class="text-slate-300 mb-6 leading-relaxed">
          {{ cert.description }}
        </p>
        
        <button 
          class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-medium py-3 px-4 rounded-xl transition-all duration-300 transform hover:scale-[1.02] shadow-lg hover:shadow-blue-500/30 flex items-center justify-center">
          <i class="fas fa-external-link-alt mr-2"></i>
          View Certificate
        </button>
      </div>
    </div>
  </div>
</section>
