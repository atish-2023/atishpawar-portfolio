<section class="min-h-screen py-20 px-4 sm:px-6 lg:px-8 bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900">
  <div class="max-w-7xl mx-auto">
    <!-- Section Header -->
    <div class="text-center mb-16">
      <h2 class="text-3xl md:text-4xl font-bold text-white mb-4">Get In Touch</h2>
      <div class="w-20 h-1 bg-gradient-to-r from-blue-500 to-purple-500 mx-auto rounded-full"></div>
      <p class="mt-6 text-xl text-gray-300 max-w-3xl mx-auto">
        Have a project in mind or want to discuss opportunities? Let's connect!
      </p>
    </div>

    <!-- Two Column Layout -->
    <div class="flex flex-col lg:flex-row gap-8 lg:gap-12">
      <!-- Left Column - Contact Form -->
      <div class="lg:w-1/2">
        <div class="bg-gray-800/30 backdrop-blur-lg rounded-2xl p-8 shadow-2xl border border-gray-700/50 transition-all duration-300 hover:border-gray-600/50">
          <form class="space-y-6">
            <!-- Full Name Field -->
            <div class="relative">
              <input type="text" id="name" class="peer w-full bg-gray-900/50 backdrop-blur-sm border border-gray-700 rounded-xl py-4 px-4 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300" placeholder=" " />
              <label for="name" class="absolute left-4 top-4 text-gray-400 peer-focus:text-blue-400 peer-placeholder-shown:top-4 peer-placeholder-shown:text-gray-400 peer-focus:top-2 peer-focus:text-xs peer-focus:font-medium transition-all duration-300 cursor-text">Full Name</label>
            </div>

            <!-- Email Field -->
            <div class="relative">
              <input type="email" id="email" class="peer w-full bg-gray-900/50 backdrop-blur-sm border border-gray-700 rounded-xl py-4 px-4 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300" placeholder=" " />
              <label for="email" class="absolute left-4 top-4 text-gray-400 peer-focus:text-blue-400 peer-placeholder-shown:top-4 peer-placeholder-shown:text-gray-400 peer-focus:top-2 peer-focus:text-xs peer-focus:font-medium transition-all duration-300 cursor-text">Email Address</label>
            </div>

            <!-- Subject Field -->
            <div class="relative">
              <input type="text" id="subject" class="peer w-full bg-gray-900/50 backdrop-blur-sm border border-gray-700 rounded-xl py-4 px-4 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300" placeholder=" " />
              <label for="subject" class="absolute left-4 top-4 text-gray-400 peer-focus:text-blue-400 peer-placeholder-shown:top-4 peer-placeholder-shown:text-gray-400 peer-focus:top-2 peer-focus:text-xs peer-focus:font-medium transition-all duration-300 cursor-text">Subject</label>
            </div>

            <!-- Message Field -->
            <div class="relative">
              <textarea id="message" rows="5" class="peer w-full bg-gray-900/50 backdrop-blur-sm border border-gray-700 rounded-xl py-4 px-4 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300 resize-none" placeholder=" "></textarea>
              <label for="message" class="absolute left-4 top-4 text-gray-400 peer-focus:text-blue-400 peer-placeholder-shown:top-4 peer-placeholder-shown:text-gray-400 peer-focus:top-2 peer-focus:text-xs peer-focus:font-medium transition-all duration-300 cursor-text">Message</label>
            </div>

            <!-- Submit Button -->
            <div>
              <button type="submit" class="w-[200px] bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-bold py-2.5 px-2.5 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
                Send Message
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Right Column - Contact Info -->
      <div class="lg:w-1/2">
        <div class="bg-gray-900/40 backdrop-blur-xl rounded-2xl p-8 shadow-2xl border border-gray-700/30 transition-all duration-300 hover:border-gray-600/30">
          <h3 class="text-2xl font-bold text-white mb-8">Contact Information</h3>
          
          <div class="space-y-8">
            <!-- Phone -->
            <div class="flex items-start group">
              <div class="flex-shrink-0 bg-blue-500/20 p-3 rounded-xl mr-4 group-hover:bg-blue-500/30 transition-all duration-300">
                <svg class="w-6 h-6 text-blue-400 group-hover:text-blue-300 transition-colors duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                </svg>
              </div>
              <div>
                <h4 class="text-lg font-semibold text-white">Phone</h4>
                <p class="text-gray-300 mt-1">+1 (123) 456-7890</p>
              </div>
            </div>

            <!-- Email -->
            <div class="flex items-start group">
              <div class="flex-shrink-0 bg-blue-500/20 p-3 rounded-xl mr-4 group-hover:bg-blue-500/30 transition-all duration-300">
                <svg class="w-6 h-6 text-blue-400 group-hover:text-blue-300 transition-colors duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                </svg>
              </div>
              <div>
                <h4 class="text-lg font-semibold text-white">Email</h4>
                <p class="text-gray-300 mt-1">contact&#64;atishpawar.com</p>
              </div>
            </div>

            <!-- Location -->
            <div class="flex items-start group">
              <div class="flex-shrink-0 bg-blue-500/20 p-3 rounded-xl mr-4 group-hover:bg-blue-500/30 transition-all duration-300">
                <svg class="w-6 h-6 text-blue-400 group-hover:text-blue-300 transition-colors duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
              </div>
              <div>
                <h4 class="text-lg font-semibold text-white">Location</h4>
                <p class="text-gray-300 mt-1">San Francisco, California</p>
              </div>
            </div>
          </div>

          <!-- Social Media Links -->
          <div class="mt-12">
            <h4 class="text-lg font-semibold text-white mb-6">Follow Me</h4>
            <div class="flex space-x-2 md:space-x-4">
              <!-- GitHub -->
              <a href="#" class="bg-gray-800/50 hover:bg-gray-700/50 p-4 rounded-xl transition-all duration-300 group">
                <svg class="w-6 h-6 text-gray-300 group-hover:text-white transition-colors duration-300" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"></path>
                </svg>
              </a>

              <!-- LinkedIn -->
              <a href="#" class="bg-blue-800/30 hover:bg-blue-700/40 p-4 rounded-xl transition-all duration-300 group">
                <svg class="w-6 h-6 text-blue-300 group-hover:text-blue-200 transition-colors duration-300" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"></path>
                </svg>
              </a>

              <!-- Twitter -->
              <a href="#" class="bg-sky-500/20 hover:bg-sky-500/30 p-4 rounded-xl transition-all duration-300 group">
                <svg class="w-6 h-6 text-sky-400 group-hover:text-sky-300 transition-colors duration-300" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"></path>
                </svg>
              </a>

              <!-- Instagram -->
              <a href="#" class="bg-pink-500/20 hover:bg-pink-500/30 p-4 rounded-xl transition-all duration-300 group">
                <svg class="w-6 h-6 text-pink-400 group-hover:text-pink-300 transition-colors duration-300" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.689-.07-4.849 0-3.204.013-3.583.07-4.847zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"></path>
                </svg>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Scroll to Top Button -->
<button 
  id="scrollTopBtn"
  (click)="scrollToTop()"
  class="fixed bottom-8 right-8 w-12 h-12 rounded-full bg-gradient-to-r from-blue-600 to-purple-600 shadow-lg hover:shadow-xl transition-all duration-300 transform hover:scale-110 z-50 opacity-0 translate-y-5 transition-opacity duration-300 ease-in-out flex items-center justify-center"
  aria-label="Scroll to top">
  <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
  </svg>
</button>
