<!-- Loading State -->
<div *ngIf="loading" class="flex justify-center items-center py-20">
  <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div>
  <span class="ml-3 text-slate-300">Loading contact information...</span>
</div>

<!-- Error State -->
<div *ngIf="!loading && error" class="py-20 text-center">
  <div class="bg-red-900/50 border border-red-700 rounded-xl p-6 max-w-2xl mx-auto">
    <div class="flex items-center justify-center mb-4">
      <svg class="w-8 h-8 text-red-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      <h3 class="text-xl font-bold text-red-400">Error Loading Data</h3>
    </div>
    <p class="text-slate-300 mb-4">{{ error }}</p>
    <button (click)="loadData()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition duration-300">
      Retry
    </button>
  </div>
</div>

<!-- Content State -->
<section id="contact" class="py-20 relative overflow-hidden section-bg" *ngIf="!loading && !error && contactData">
  <!-- Background elements -->
  <div class="absolute inset-0 bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900"></div>
  <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,rgba(236,72,153,0.1)_0%,rgba(0,0,0,0)_70%)]"></div>
  
  <div class="max-w-7xl mx-auto px-4 relative z-10">
    <!-- Section Header -->
    <div class="text-center mb-16">
      <h2 class="text-3xl md:text-4xl font-bold text-white mb-4 section-heading">{{ contactData.title }}</h2>
    </div>

    <!-- Two Column Layout -->
    <div class="flex flex-col lg:flex-row gap-8 lg:gap-12">
      <!-- Left Column - Contact Form -->
      <div class="lg:w-1/2">
        <div class="bg-gray-800/30 backdrop-blur-lg rounded-2xl p-8 shadow-2xl border border-gray-700/50 transition-all duration-300 hover:border-gray-600/50">
          <form class="space-y-6">
            <!-- Full Name Field -->
            <div class="relative">
              <input type="text" id="name" class="peer w-full bg-gray-900/50 backdrop-blur-sm border border-gray-700 rounded-xl py-4 px-4 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300" placeholder=" " />
              <label for="name" class="absolute left-4 top-4 text-gray-400 peer-focus:text-blue-400 peer-placeholder-shown:top-4 peer-placeholder-shown:text-gray-400 peer-focus:top-2 peer-focus:text-xs peer-focus:font-medium transition-all duration-300 cursor-text">Full Name</label>
            </div>

            <!-- Email Field -->
            <div class="relative">
              <input type="email" id="email" class="peer w-full bg-gray-900/50 backdrop-blur-sm border border-gray-700 rounded-xl py-4 px-4 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300" placeholder=" " />
              <label for="email" class="absolute left-4 top-4 text-gray-400 peer-focus:text-blue-400 peer-placeholder-shown:top-4 peer-placeholder-shown:text-gray-400 peer-focus:top-2 peer-focus:text-xs peer-focus:font-medium transition-all duration-300 cursor-text">Email Address</label>
            </div>

            <!-- Subject Field -->
            <div class="relative">
              <input type="text" id="subject" class="peer w-full bg-gray-900/50 backdrop-blur-sm border border-gray-700 rounded-xl py-4 px-4 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300" placeholder=" " />
              <label for="subject" class="absolute left-4 top-4 text-gray-400 peer-focus:text-blue-400 peer-placeholder-shown:top-4 peer-placeholder-shown:text-gray-400 peer-focus:top-2 peer-focus:text-xs peer-focus:font-medium transition-all duration-300 cursor-text">Subject</label>
            </div>

            <!-- Message Field -->
            <div class="relative">
              <textarea id="message" rows="5" class="peer w-full bg-gray-900/50 backdrop-blur-sm border border-gray-700 rounded-xl py-4 px-4 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300 resize-none" placeholder=" "></textarea>
              <label for="message" class="absolute left-4 top-4 text-gray-400 peer-focus:text-blue-400 peer-placeholder-shown:top-4 peer-placeholder-shown:text-gray-400 peer-focus:top-2 peer-focus:text-xs peer-focus:font-medium transition-all duration-300 cursor-text">Your Message</label>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-bold py-4 px-6 rounded-xl shadow-lg hover:shadow-xl transition duration-300 transform hover:-translate-y-0.5">
              Send Message
            </button>
          </form>
        </div>
      </div>

      <!-- Right Column - Contact Info -->
      <div class="lg:w-1/2">
        <div class="bg-gray-900/40 backdrop-blur-xl rounded-2xl p-8 shadow-2xl border border-gray-700/30 transition-all duration-300 hover:border-gray-600/30">
          <h3 class="text-2xl font-bold text-white mb-8">Contact Information</h3>
          
          <div class="space-y-8">
            <!-- Phone -->
            <div class="flex items-start group" *ngIf="contactData.phone">
              <div class="flex-shrink-0 bg-blue-500/20 p-3 rounded-xl mr-4 group-hover:bg-blue-500/30 transition-all duration-300">
                <svg class="w-6 h-6 text-blue-400 group-hover:text-blue-300 transition-colors duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                </svg>
              </div>
              <div>
                <h4 class="text-lg font-semibold text-white">Phone</h4>
                <p class="text-gray-300 mt-1 contact-info-text">{{ contactData.phone }}</p>
              </div>
            </div>

            <!-- Email -->
            <div class="flex items-start group" *ngIf="contactData.email">
              <div class="flex-shrink-0 bg-purple-500/20 p-3 rounded-xl mr-4 group-hover:bg-purple-500/30 transition-all duration-300">
                <svg class="w-6 h-6 text-purple-400 group-hover:text-purple-300 transition-colors duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                </svg>
              </div>
              <div>
                <h4 class="text-lg font-semibold text-white">Email</h4>
                <p class="text-gray-300 mt-1 contact-info-text">{{ contactData.email }}</p>
              </div>
            </div>

            <!-- Location -->
            <div class="flex items-start group" *ngIf="contactData.location">
              <div class="flex-shrink-0 bg-pink-500/20 p-3 rounded-xl mr-4 group-hover:bg-pink-500/30 transition-all duration-300">
                <svg class="w-6 h-6 text-pink-400 group-hover:text-pink-300 transition-colors duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
              </div>
              <div>
                <h4 class="text-lg font-semibold text-white">Location</h4>
                <p class="text-gray-300 mt-1 contact-info-text">{{ contactData.location }}</p>
              </div>
            </div>

            <!-- Social Links -->
            <div class="pt-4" *ngIf="contactData.socialLinks">
              <h4 class="text-lg font-semibold text-white mb-4">Connect With Me</h4>
              <div class="flex flex-wrap gap-2">
                <a [href]="contactData.socialLinks.github" 
                   target="_blank" 
                   class="flex items-center justify-center w-12 h-12 rounded-xl bg-gray-800/50 hover:bg-gray-700/50 border border-gray-700/50 hover:border-gray-600/50 transition-all duration-300 group"
                   aria-label="GitHub">
                  <i class="fab fa-github text-2xl group-hover:text-blue-400 transition-colors duration-300"></i>
                </a>
                <a [href]="contactData.socialLinks.linkedin" 
                   target="_blank" 
                   class="flex items-center justify-center w-12 h-12 rounded-xl bg-gray-800/50 hover:bg-gray-700/50 border border-gray-700/50 hover:border-gray-600/50 transition-all duration-300 group"
                   aria-label="LinkedIn">
                  <i class="fab fa-linkedin-in text-2xl group-hover:text-blue-400 transition-colors duration-300"></i>
                </a>
                <a [href]="contactData.socialLinks.twitter" 
                   target="_blank" 
                   class="flex items-center justify-center w-12 h-12 rounded-xl bg-gray-800/50 hover:bg-gray-700/50 border border-gray-700/50 hover:border-gray-600/50 transition-all duration-300 group"
                   aria-label="Twitter">
                  <i class="fab fa-twitter text-2xl group-hover:text-blue-400 transition-colors duration-300"></i>
                </a>
                <a [href]="contactData.socialLinks.instagram" 
                   target="_blank" 
                   class="flex items-center justify-center w-12 h-12 rounded-xl bg-gray-800/50 hover:bg-gray-700/50 border border-gray-700/50 hover:border-gray-600/50 transition-all duration-300 group"
                   aria-label="Instagram">
                  <i class="fab fa-instagram text-2xl group-hover:text-blue-400 transition-colors duration-300"></i>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
