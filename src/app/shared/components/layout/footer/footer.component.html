<footer class="relative overflow-hidden bg-gradient-to-r from-slate-900 via-indigo-900 to-slate-800 text-white py-12 border-t border-slate-700/50">
  <!-- Animated background glow effect -->
  <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,rgba(99,102,241,0.1)_0%,rgba(0,0,0,0)_70%)]"></div>
  <div class="absolute top-0 left-1/4 w-64 h-64 bg-blue-500/10 rounded-full blur-3xl animate-pulse"></div>

  <div class="container mx-auto px-4 relative z-10">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
      <!-- About Me Column -->
      <div class="animate-fade-in-up" style="animation-delay: 100ms;">

        </h3>
        <p class="text-slate-300 mb-6 leading-relaxed">
          Full Stack Developer passionate about creating beautiful, functional web applications with modern technologies.
        </p>
        
        

      </div>
      
      <!-- Quick Links Column -->
      <div class="quick-links-container animate-fade-in-up" style="animation-delay: 200ms;">
        <h4 class="text-xl font-semibold mb-6 text-slate-100">Quick Links</h4>
        <ul class="quick-links-list space-y-3">
          <li>
            <a href="#hero" class="text-slate-300 hover:text-blue-400 transition duration-300 flex items-center group">
              <i class="fas fa-chevron-right text-blue-500 mr-2 transform group-hover:translate-x-1 transition-transform"></i>
              Home
            </a>
          </li>
          <li>
            <a href="#about" class="text-slate-300 hover:text-blue-400 transition duration-300 flex items-center group">
              <i class="fas fa-chevron-right text-blue-500 mr-2 transform group-hover:translate-x-1 transition-transform"></i>
              About
            </a>
          </li>
          <li>
            <a href="#skills" class="text-slate-300 hover:text-blue-400 transition duration-300 flex items-center group">
              <i class="fas fa-chevron-right text-blue-500 mr-2 transform group-hover:translate-x-1 transition-transform"></i>
              Skills
            </a>
          </li>
          <li>
            <a href="#projects" class="text-slate-300 hover:text-blue-400 transition duration-300 flex items-center group">
              <i class="fas fa-chevron-right text-blue-500 mr-2 transform group-hover:translate-x-1 transition-transform"></i>
              Projects
            </a>
          </li>
          <li>
            <a href="#experience" class="text-slate-300 hover:text-blue-400 transition duration-300 flex items-center group">
              <i class="fas fa-chevron-right text-blue-500 mr-2 transform group-hover:translate-x-1 transition-transform"></i>
              Experience
            </a>
          </li>
        </ul>
      </div>
      
      <!-- Contact Column -->
      <div class="contact-column animate-fade-in-up" style="animation-delay: 300ms;">
       
        <!-- Newsletter Signup -->
        <div class="newsletter-container mt-8">
          <h5 class="text-lg font-medium mb-3 text-slate-100 text-center md:text-right">Stay Updated</h5>
          <div class="flex flex-col md:flex-row md:justify-end space-y-2 md:space-y-0 md:space-x-2">
            <input 
              type="email" 
              placeholder="Your email" 
              class="bg-white/5 backdrop-blur-sm border border-white/10 rounded-lg px-4 py-2 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 w-full"
            >
            <button class="bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white px-4 py-2 rounded-lg transition duration-300 transform hover:scale-105 shadow-lg hover:shadow-blue-500/30 whitespace-nowrap">
              Subscribe
            </button>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Copyright Line -->
    <div class="border-t border-slate-700/50 mt-12 pt-8 text-center text-slate-400">
      <p>&copy; {{ currentYear }} <span class="bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">Atish Pawar</span>. All rights reserved.</p>
