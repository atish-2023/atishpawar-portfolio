<div class="relative md:grid md:grid-cols-2 md:gap-12 items-center group">
  <!-- Company logo on the timeline -->
  <div class="absolute left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-white/10 backdrop-blur-sm border border-white/20 flex items-center justify-center z-10 transition-all duration-300 hover:scale-110 hover:bg-white/20 hover:shadow-[0_0_15px_rgba(59,130,246,0.5)]" 
       *ngIf="hasImage">
    <img [src]="item.image" [alt]="item.subtitle" class="w-8 h-8 object-contain">
  </div>
  
  <!-- Fallback dot if no image -->
  <div class="absolute left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-4 h-4 rounded-full bg-blue-500 shadow-lg shadow-blue-500/50 animate-pulse z-10" 
       *ngIf="!hasImage">
  </div>
  
  <!-- Card on the left for left-aligned items -->
  <div class="hidden md:block md:col-start-1 md:row-start-1" *ngIf="showLeftCard">
    <div class="glassmorphism-enhanced rounded-xl p-6 border border-white/10 transition-all duration-500 hover:scale-105 hover:shadow-xl hover:shadow-blue-500/20">
      <ng-container *ngTemplateOutlet="cardContent"></ng-container>
    </div>
  </div>
  
  <!-- Card on the right for right-aligned items -->
  <div class="hidden md:block md:col-start-2 md:row-start-1" *ngIf="showRightCard">
    <div class="glassmorphism-enhanced rounded-xl p-6 border border-white/10 transition-all duration-500 hover:scale-105 hover:shadow-xl hover:shadow-blue-500/20">
      <ng-container *ngTemplateOutlet="cardContent"></ng-container>
    </div>
  </div>
  
  <!-- Empty divs for spacing -->
  <div class="md:col-start-2 md:row-start-1" *ngIf="showLeftCard"></div>
  <div class="md:col-start-1 md:row-start-1" *ngIf="showRightCard"></div>
  
  <!-- Mobile version (centered) -->
  <div class="md:hidden mt-8">
    <div class="glassmorphism-enhanced rounded-xl p-6 border border-white/10 transition-all duration-500 hover:scale-105 hover:shadow-xl hover:shadow-blue-500/20">
      <ng-container *ngTemplateOutlet="cardContent"></ng-container>
    </div>
  </div>
</div>

<!-- Shared card content template -->
<ng-template #cardContent>
  <div class="flex items-start mb-4">
    <div class="flex-shrink-0 {{ item.bgColor }} p-3 rounded-xl mr-4" *ngIf="item.icon">
      <i class="{{ item.icon }} text-2xl {{ item.iconColor }}"></i>
    </div>
    <div>
      <h3 class="text-2xl font-semibold text-white">{{ item.title }}</h3>
      <p class="text-lg text-indigo-300">{{ item.subtitle }}</p>
      <span class="text-sm text-slate-400">{{ item.period }}</span>
    </div>
  </div>
  <p class="text-slate-300 leading-relaxed mb-4">
    {{ item.description }}
  </p>
  <div class="flex items-center text-slate-400 mb-4" *ngIf="hasLocation">
    <i class="fas fa-map-marker-alt mr-2"></i>
    <span>{{ item.location }}</span>
  </div>
  <div class="mt-4 flex flex-wrap gap-2" *ngIf="hasTechnologies">
    <span 
      class="bg-gradient-to-r from-blue-500/20 to-purple-500/20 text-blue-200 text-xs font-semibold px-3 py-1 rounded-full border border-blue-500/30 hover:from-blue-500/30 hover:to-purple-500/30 transition-all duration-300" 
      *ngFor="let tech of item.technologies">
      {{ tech }}
    </span>
  </div>
  <div class="mt-4" *ngIf="hasCoursework">
    <h4 class="text-md font-semibold text-white mb-2">Coursework</h4>
    <ul class="list-disc list-inside text-slate-300 space-y-1">
      <li *ngFor="let course of item.coursework">{{ course }}</li>
    </ul>
  </div>
  <div class="mt-4" *ngIf="hasAchievements">
    <h4 class="text-md font-semibold text-white mb-2">Key Achievements</h4>
    <ul class="list-disc list-inside text-slate-300 space-y-1">
      <li *ngFor="let achievement of item.achievements">{{ achievement }}</li>
    </ul>
  </div>
  <div class="mt-4" *ngIf="hasKeyProjects">
    <h4 class="text-md font-semibold text-white mb-2">Key Projects</h4>
    <ul class="list-disc list-inside text-slate-300 space-y-1">
      <li *ngFor="let project of item.keyProjects">{{ project }}</li>
    </ul>
  </div>
</ng-template>
