<div class="bg-slate-800/50 backdrop-blur rounded-2xl shadow-lg overflow-hidden h-full flex flex-col transition-all duration-300 hover:shadow-2xl hover:-translate-y-2 border border-slate-700/30">
  <div class="bg-gradient-to-br from-slate-700 to-slate-800 border-2 border-dashed w-full h-48 flex items-center justify-center" *ngIf="!project || !project.images || project.images.length === 0; else projectImages">
    <svg class="w-16 h-16 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
    </svg>
  </div>
  <ng-template #projectImages>
    <img [src]="project.images ? project.images[0] : ''" alt="{{ project.title }}" class="w-full h-48 object-cover hover:scale-105 transition-transform duration-300">
  </ng-template>
  <div class="p-6 flex flex-col flex-grow">
    <h3 class="text-xl font-bold text-text-primary mb-2 font-heading">{{ project.title }}</h3>
    <p class="text-text-secondary mb-4 flex-grow">{{ project.description }}</p>
    <div class="flex flex-wrap gap-2 mb-4">
      <span 
        class="bg-primary/20 text-primary text-xs font-semibold px-3 py-1 rounded-full hover:bg-primary/30 transition-colors duration-300" 
        *ngFor="let tag of project.tags">
        {{ tag }}
      </span>
    </div>
    <div class="flex space-x-4 mt-auto pt-4 border-t border-slate-700/50">
      <a 
        [href]="project.repoUrl" 
        target="_blank" 
        class="px-4 py-2 border border-slate-600 text-text-secondary rounded-lg hover:bg-slate-700/50 hover:text-text-primary transition duration-300 flex items-center"
        *ngIf="project.repoUrl">
        <svg class="w-5 h-5 inline mr-1" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"></path>
        </svg>
        GitHub
      </a>
      <a 
        [href]="project.liveUrl" 
        target="_blank" 
        class="px-4 py-2 bg-gradient-to-r from-primary to-secondary text-neutral rounded-lg shadow hover:shadow-lg transition duration-300 flex items-center"
        *ngIf="project.liveUrl">
        <svg class="w-5 h-5 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
        </svg>
        Live Demo
      </a>
    </div>
  </div>
</div>
