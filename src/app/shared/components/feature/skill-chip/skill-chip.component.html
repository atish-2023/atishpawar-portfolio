<div class="skill-card bg-slate-800/50 backdrop-blur-sm rounded-2xl shadow-lg p-6 text-center h-full transition-all duration-300 border border-slate-700/30 hover:border-primary/50 hover:shadow-xl">
    <div class="flex justify-center mb-6">
        <div class="bg-gradient-to-br from-primary/20 to-secondary/20 p-4 rounded-2xl">
            <i class="fas fa-laptop-code text-3xl text-primary"></i>
        </div>
    </div>
    <h3 class="text-xl font-bold text-text-primary mb-3 font-heading">{{ skill.name }}</h3>
    <p class="text-text-secondary mb-4 text-sm">{{ skill.category }}</p>
    <div class="flex flex-wrap justify-center gap-2">
        <span 
          class="bg-primary/20 text-primary text-xs font-semibold px-3 py-1 rounded-full hover:bg-primary/30 transition-colors duration-300" 
          *ngFor="let tech of skill.technologies">
          {{ tech }}
        </span>
    </div>
</div>
