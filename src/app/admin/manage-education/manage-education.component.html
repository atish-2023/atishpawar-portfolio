<div class="bg-gray-800/40 backdrop-blur-lg rounded-xl p-8 border border-gray-700/50">
  <h1 class="text-2xl font-bold text-white mb-6">Manage Education</h1>
  
  <!-- Education Form -->
  <form (ngSubmit)="onSubmit()" [formGroup]="educationForm" class="mb-12">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
      <div>
        <label class="block text-slate-300 text-sm font-medium mb-2" for="institution">
          Institution
        </label>
        <input
          class="w-full px-4 py-3 bg-gray-700/50 border border-gray-600/50 rounded-lg text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all"
          id="institution"
          type="text"
          placeholder="Institution name"
          formControlName="institution">
      </div>
      
      <div>
        <label class="block text-slate-300 text-sm font-medium mb-2" for="degree">
          Degree
        </label>
        <input
          class="w-full px-4 py-3 bg-gray-700/50 border border-gray-600/50 rounded-lg text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all"
          id="degree"
          type="text"
          placeholder="Degree title"
          formControlName="degree">
      </div>
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
      <div>
        <label class="block text-slate-300 text-sm font-medium mb-2" for="period">
          Period
        </label>
        <input
          class="w-full px-4 py-3 bg-gray-700/50 border border-gray-600/50 rounded-lg text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all"
          id="period"
          type="text"
          placeholder="e.g., 2014 - 2016"
          formControlName="period">
      </div>
    </div>
    
    <div class="mb-6">
      <label class="block text-slate-300 text-sm font-medium mb-2" for="description">
        Description
      </label>
      <textarea
        class="w-full px-4 py-3 bg-gray-700/50 border border-gray-600/50 rounded-lg text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all"
        id="description"
        rows="3"
        placeholder="Additional details about your education"
        formControlName="description"></textarea>
    </div>
    
    <div class="mb-6">
      <label class="block text-slate-300 text-sm font-medium mb-2" for="coursework">
        Coursework (comma separated)
      </label>
      <input
        class="w-full px-4 py-3 bg-gray-700/50 border border-gray-600/50 rounded-lg text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all"
        id="coursework"
        type="text"
        placeholder="e.g., Advanced Algorithms, Database Systems, Web Development"
        formControlName="coursework">
      <p class="mt-1 text-sm text-slate-500">Enter coursework separated by commas</p>
    </div>
    
    <div class="flex items-center justify-end space-x-4">
      <button
        *ngIf="isEditing"
        class="px-4 py-2 bg-gray-600 hover:bg-gray-700 text-white font-medium rounded-lg transition-colors"
        type="button"
        (click)="cancelEdit()">
        Cancel
      </button>
      <button
        class="px-4 py-2 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-medium rounded-lg transition-all transform hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-blue-500/50"
        type="submit"
        [disabled]="educationForm.invalid">
        {{ isEditing ? 'Update Education' : 'Add Education' }}
      </button>
    </div>
  </form>
</div>

<!-- Education List -->
<div class="bg-gray-800/40 backdrop-blur-lg rounded-xl p-6 border border-gray-700/50">
  <h2 class="text-xl font-semibold text-white mb-6">Education History</h2>
  
  <div class="space-y-6">
    <div 
      *ngFor="let edu of education" 
      class="bg-gray-800/50 backdrop-blur-sm rounded-xl p-5 border border-gray-700/50 hover:border-gray-600/50 transition-all duration-300">
      <div class="flex justify-between items-start mb-3">
        <div>
          <h3 class="text-lg font-bold text-white">{{ edu.degree }}</h3>
          <p class="text-slate-300">{{ edu.institution }} | {{ edu.period }}</p>
        </div>
        <div class="flex space-x-2">
          <button
            class="p-2 rounded-lg bg-blue-500/20 hover:bg-blue-500/30 text-blue-400 transition-colors"
            (click)="editEducation(edu)">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
            </svg>
          </button>
          <button
            class="p-2 rounded-lg bg-red-500/20 hover:bg-red-500/30 text-red-400 transition-colors"
            (click)="deleteEducation(edu.id!)">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
            </svg>
          </button>
        </div>
      </div>
      <p class="text-slate-400 mb-3">{{ edu.description }}</p>
      <div *ngIf="edu.coursework && edu.coursework.length > 0" class="mt-2">
        <h4 class="text-sm font-medium text-slate-300 mb-1">Coursework:</h4>
        <p class="text-xs text-slate-400">{{ edu.coursework.join(', ') }}</p>
      </div>
    </div>
    <div *ngIf="education.length === 0" class="text-center py-12">
      <div class="text-slate-500 mb-4">
        <svg class="w-16 h-16 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
        </svg>
      </div>
      <h3 class="text-lg font-medium text-slate-400 mb-2">No education entries found</h3>
      <p class="text-slate-500">Add your first education using the form above.</p>
    </div>
  </div>
</div>
