<!-- Add/Edit Skill Form -->
<div class="bg-gray-800/40 backdrop-blur-lg rounded-xl p-6 border border-gray-700/50 mb-8">
  <h2 class="text-xl font-semibold text-white mb-6">{{ isEditing ? 'Edit Skill' : 'Add New Skill' }}</h2>
  
  <form (ngSubmit)="onSubmit()" [formGroup]="skillForm" class="mb-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
      <div>
        <label class="block text-slate-300 text-sm font-medium mb-2" for="name">
          Skill Name
        </label>
        <input
          class="w-full px-4 py-3 bg-gray-700/50 border border-gray-600/50 rounded-lg text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all"
          id="name"
          type="text"
          placeholder="Skill name"
          formControlName="name">
      </div>
      
      <div>
        <label class="block text-slate-300 text-sm font-medium mb-2" for="level">
          Proficiency Level (0-100)
        </label>
        <input
          class="w-full px-4 py-3 bg-gray-700/50 border border-gray-600/50 rounded-lg text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all"
          id="level"
          type="number"
          min="0"
          max="100"
          placeholder="Proficiency level"
          formControlName="level">
      </div>
      
      <div>
        <label class="block text-slate-300 text-sm font-medium mb-2" for="category">
          Category
        </label>
        <select
          class="w-full px-4 py-3 bg-gray-700/50 border border-gray-600/50 rounded-lg text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all"
          id="category"
          formControlName="category">
          <option value="Frontend">Frontend</option>
          <option value="Backend">Backend</option>
          <option value="Database">Database</option>
          <option value="Tools">Tools</option>
          <option value="Other">Other</option>
        </select>
      </div>
      
      <div>
        <label class="block text-slate-300 text-sm font-medium mb-2" for="order">
          Display Order
        </label>
        <input
          class="w-full px-4 py-3 bg-gray-700/50 border border-gray-600/50 rounded-lg text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all"
          id="order"
          type="number"
          placeholder="Display order"
          formControlName="order">
      </div>
    </div>
    
    <div class="mb-6">
      <label class="block text-slate-300 text-sm font-medium mb-2" for="icon">
        Icon URL (optional)
      </label>
      <input
        class="w-full px-4 py-3 bg-gray-700/50 border border-gray-600/50 rounded-lg text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all"
        id="icon"
        type="text"
        placeholder="URL to skill icon"
        formControlName="icon">
    </div>
    
    <div class="flex items-center justify-end space-x-4">
      <button
        *ngIf="isEditing"
        class="px-4 py-2 bg-gray-600 hover:bg-gray-700 text-white font-medium rounded-lg transition-colors"
        type="button"
        (click)="cancelEdit()">
        Cancel
      </button>
      <button
        class="px-4 py-2 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-medium rounded-lg transition-all transform hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-blue-500/50"
        type="submit"
        [disabled]="skillForm.invalid">
        {{ isEditing ? 'Update Skill' : 'Add Skill' }}
      </button>
    </div>
  </form>
</div>

<!-- Skills List -->
<div class="bg-gray-800/40 backdrop-blur-lg rounded-xl p-6 border border-gray-700/50">
  <h2 class="text-xl font-semibold text-white mb-6">Current Skills</h2>
  
  <div class="overflow-x-auto">
    <table class="min-w-full">
      <thead>
        <tr class="border-b border-gray-700/50">
          <th class="py-3 px-4 text-left text-slate-300 font-medium">Skill</th>
          <th class="py-3 px-4 text-left text-slate-300 font-medium">Category</th>
          <th class="py-3 px-4 text-left text-slate-300 font-medium">Level</th>
          <th class="py-3 px-4 text-left text-slate-300 font-medium">Order</th>
          <th class="py-3 px-4 text-left text-slate-300 font-medium">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let skill of skills" class="border-b border-gray-700/30 hover:bg-gray-700/20 transition-colors">
          <td class="py-3 px-4 text-slate-200">{{ skill.name }}</td>
          <td class="py-3 px-4 text-slate-300">
            <span class="px-2 py-1 bg-blue-500/20 text-blue-300 rounded-full text-xs">{{ skill.category }}</span>
          </td>
          <td class="py-3 px-4">
            <div class="flex items-center">
              <div class="w-24 bg-gray-700 rounded-full h-2 mr-2">
                <div 
                  class="bg-gradient-to-r from-blue-500 to-purple-500 h-2 rounded-full" 
                  [style.width.%]="skill.level">
                </div>
              </div>
              <span class="text-slate-300 text-sm">{{ skill.level }}%</span>
            </div>
          </td>
          <td class="py-3 px-4 text-slate-300">{{ skill.order }}</td>
          <td class="py-3 px-4">
            <div class="flex space-x-2">
              <button
                class="p-2 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 text-amber-400 transition-colors"
                (click)="editSkill(skill)">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                </svg>
              </button>
              <button
                class="p-2 rounded-lg bg-red-500/20 hover:bg-red-500/30 text-red-400 transition-colors"
                (click)="deleteSkill(skill.id!)">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
              </button>
            </div>
          </td>
        </tr>
        <tr *ngIf="skills.length === 0">
          <td colspan="5" class="py-8 px-4 text-center text-slate-400">
            No skills found. Add your first skill above.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
