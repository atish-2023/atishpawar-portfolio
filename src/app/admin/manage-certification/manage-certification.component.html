<div>
  <!-- Page Header -->
  <div class="mb-6">
    <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">
      Manage Certifications
    </h1>
  </div>

  <!-- Add/Edit Certification Form -->
  <div class="bg-gray-800/40 backdrop-blur-lg rounded-xl p-6 border border-gray-700/50 mb-8">
    <h2 class="text-xl font-semibold text-white mb-6">{{ isEditing ? 'Edit Certification' : 'Add New Certification' }}</h2>
    
    <form (ngSubmit)="onSubmit()" [formGroup]="certificationForm" class="mb-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
        <div>
          <label class="block text-slate-300 text-sm font-medium mb-2" for="name">
            Certification Name
          </label>
          <input
            class="w-full px-4 py-3 bg-gray-700/50 border border-gray-600/50 rounded-lg text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all"
            id="name"
            type="text"
            placeholder="Certification name"
            formControlName="name">
        </div>
        
        <div>
          <label class="block text-slate-300 text-sm font-medium mb-2" for="issuer">
            Issuing Organization
          </label>
          <input
            class="w-full px-4 py-3 bg-gray-700/50 border border-gray-600/50 rounded-lg text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all"
            id="issuer"
            type="text"
            placeholder="Issuing organization"
            formControlName="issuer">
        </div>
      </div>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
        <div>
          <label class="block text-slate-300 text-sm font-medium mb-2" for="date">
            Date Earned
          </label>
          <input
            class="w-full px-4 py-3 bg-gray-700/50 border border-gray-600/50 rounded-lg text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all"
            id="date"
            type="text"
            placeholder="e.g., March 2023"
            formControlName="date">
        </div>
        
        <div>
          <label class="block text-slate-300 text-sm font-medium mb-2" for="link">
            Verification Link (optional)
          </label>
          <input
            class="w-full px-4 py-3 bg-gray-700/50 border border-gray-600/50 rounded-lg text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all"
            id="link"
            type="text"
            placeholder="https://certification-link.com"
            formControlName="link">
        </div>
      </div>
      
      <div class="mb-6">
        <label class="block text-slate-300 text-sm font-medium mb-2" for="description">
          Description
        </label>
        <textarea
          class="w-full px-4 py-3 bg-gray-700/50 border border-gray-600/50 rounded-lg text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all"
          id="description"
          rows="3"
          placeholder="Certification details"
          formControlName="description"></textarea>
      </div>
      
      <div class="flex items-center justify-end space-x-4">
        <button
          *ngIf="isEditing"
          class="px-4 py-2 bg-gray-600 hover:bg-gray-700 text-white font-medium rounded-lg transition-colors"
          type="button"
          (click)="cancelEdit()">
          Cancel
        </button>
        <button
          class="px-4 py-2 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-medium rounded-lg transition-all transform hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-blue-500/50"
          type="submit"
          [disabled]="certificationForm.invalid">
          {{ isEditing ? 'Update Certification' : 'Add Certification' }}
        </button>
      </div>
    </form>
  </div>
  
  <!-- Certifications List -->
  <div class="bg-gray-800/40 backdrop-blur-lg rounded-xl p-6 border border-gray-700/50">
    <h2 class="text-xl font-semibold text-white mb-6">Certifications</h2>
    
    <div class="space-y-6">
      <div 
        *ngFor="let cert of certifications" 
        class="bg-gray-800/50 backdrop-blur-sm rounded-xl p-5 border border-gray-700/50 hover:border-gray-600/50 transition-all duration-300">
        <div class="flex justify-between items-start mb-3">
          <div>
            <h3 class="text-lg font-bold text-white">{{ cert.name }}</h3>
            <p class="text-slate-300">{{ cert.issuer }} | {{ cert.date }}</p>
          </div>
          <div class="flex space-x-2">
            <button
              class="p-2 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 text-amber-400 transition-colors"
              (click)="editCertification(cert)">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
              </svg>
            </button>
            <button
              class="p-2 rounded-lg bg-red-500/20 hover:bg-red-500/30 text-red-400 transition-colors"
              (click)="deleteCertification(cert.id!)">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
              </svg>
            </button>
          </div>
        </div>
        <p class="text-slate-400 mb-3">{{ cert.description }}</p>
        <a *ngIf="cert.link" [href]="cert.link" target="_blank" class="text-blue-400 hover:text-blue-300 text-sm flex items-center">
          <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
          </svg>
          View Certificate
        </a>
      </div>
      <div *ngIf="certifications.length === 0" class="text-center py-12">
        <div class="text-slate-500 mb-4">
          <svg class="w-16 h-16 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
          </svg>
        </div>
        <h3 class="text-lg font-medium text-slate-400 mb-2">No certifications found</h3>
        <p class="text-slate-500">Add your first certification using the form above.</p>
      </div>
    </div>
  </div>
</div>
