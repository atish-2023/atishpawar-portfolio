<!-- Add/Edit Experience Form -->
<div class="bg-gray-800/40 backdrop-blur-lg rounded-xl p-6 border border-gray-700/50 mb-8">
  <h2 class="text-xl font-semibold text-white mb-6">{{ isEditing ? 'Edit Experience' : 'Add New Experience' }}</h2>
  
  <form (ngSubmit)="onSubmit()" [formGroup]="experienceForm" class="mb-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
      <div>
        <label class="block text-slate-300 text-sm font-medium mb-2" for="company">
          Company
        </label>
        <input
          class="w-full px-4 py-3 bg-gray-700/50 border border-gray-600/50 rounded-lg text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all"
          id="company"
          type="text"
          placeholder="Company name"
          formControlName="company">
      </div>
      
      <div>
        <label class="block text-slate-300 text-sm font-medium mb-2" for="role">
          Role
        </label>
        <input
          class="w-full px-4 py-3 bg-gray-700/50 border border-gray-600/50 rounded-lg text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all"
          id="role"
          type="text"
          placeholder="Your role"
          formControlName="role">
      </div>
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
      <div>
        <label class="block text-slate-300 text-sm font-medium mb-2" for="period">
          Period
        </label>
        <input
          class="w-full px-4 py-3 bg-gray-700/50 border border-gray-600/50 rounded-lg text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all"
          id="period"
          type="text"
          placeholder="e.g., 2020 - Present"
          formControlName="period">
      </div>
    </div>
    
    <div class="mb-6">
      <label class="block text-slate-300 text-sm font-medium mb-2" for="description">
        Description
      </label>
      <textarea
        class="w-full px-4 py-3 bg-gray-700/50 border border-gray-600/50 rounded-lg text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all"
        id="description"
        rows="3"
        placeholder="Job responsibilities and achievements"
        formControlName="description"></textarea>
    </div>
    
    <div class="mb-6">
      <label class="block text-slate-300 text-sm font-medium mb-2" for="technologies">
        Technologies (comma separated)
      </label>
      <input
        class="w-full px-4 py-3 bg-gray-700/50 border border-gray-600/50 rounded-lg text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all"
        id="technologies"
        type="text"
        placeholder="Angular, Node.js, MongoDB"
        formControlName="technologies">
    </div>
    
    <div class="flex items-center justify-end space-x-4">
      <button
        *ngIf="isEditing"
        class="px-4 py-2 bg-gray-600 hover:bg-gray-700 text-white font-medium rounded-lg transition-colors"
        type="button"
        (click)="cancelEdit()">
        Cancel
      </button>
      <button
        class="px-4 py-2 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-medium rounded-lg transition-all transform hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-blue-500/50"
        type="submit"
        [disabled]="experienceForm.invalid">
        {{ isEditing ? 'Update Experience' : 'Add Experience' }}
      </button>
    </div>
  </form>
</div>

<!-- Experience List -->
<div class="bg-gray-800/40 backdrop-blur-lg rounded-xl p-6 border border-gray-700/50">
  <h2 class="text-xl font-semibold text-white mb-6">Work Experience</h2>
  
  <div class="space-y-6">
    <div 
      *ngFor="let exp of experiences" 
      class="bg-gray-800/50 backdrop-blur-sm rounded-xl p-5 border border-gray-700/50 hover:border-gray-600/50 transition-all duration-300">
      <div class="flex justify-between items-start mb-3">
        <div>
          <h3 class="text-lg font-bold text-white">{{ exp.role }}</h3>
          <p class="text-slate-300">{{ exp.company }} | {{ exp.period }}</p>
        </div>
        <div class="flex space-x-2">
          <button
            class="p-2 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 text-amber-400 transition-colors"
            (click)="editExperience(exp)">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
            </svg>
          </button>
          <button
            class="p-2 rounded-lg bg-red-500/20 hover:bg-red-500/30 text-red-400 transition-colors"
            (click)="deleteExperience(exp.id!)">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
            </svg>
          </button>
        </div>
      </div>
      <p class="text-slate-400 mb-4">{{ exp.description }}</p>
      <div class="flex flex-wrap gap-2">
        <span 
          class="bg-blue-500/20 text-blue-300 text-xs font-medium px-2 py-1 rounded" 
          *ngFor="let tech of exp.technologies">
          {{ tech }}
        </span>
      </div>
    </div>
    <div *ngIf="experiences.length === 0" class="text-center py-12">
      <div class="text-slate-500 mb-4">
        <svg class="w-16 h-16 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
        </svg>
      </div>
      <h3 class="text-lg font-medium text-slate-400 mb-2">No experience entries found</h3>
      <p class="text-slate-500">Add your first experience using the form above.</p>
    </div>
  </div>
</div>
