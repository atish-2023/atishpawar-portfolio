<div class="bg-gray-800/40 backdrop-blur-lg rounded-xl p-8 border border-gray-700/50">
  <form (ngSubmit)="onSubmit()" [formGroup]="heroForm" class="space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <label class="block text-slate-300 text-sm font-medium mb-2" for="title">
          Title
        </label>
        <input
          class="w-full px-4 py-3 rounded-lg bg-gray-900/60 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300"
          id="title"
          type="text"
          placeholder="Your name"
          formControlName="title">
      </div>
      
      <div>
        <label class="block text-slate-300 text-sm font-medium mb-2" for="subtitle">
          Subtitle
        </label>
        <input
          class="w-full px-4 py-3 rounded-lg bg-gray-900/60 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300"
          id="subtitle"
          type="text"
          placeholder="Your role"
          formControlName="subtitle">
      </div>
    </div>
    
    <div>
      <label class="block text-slate-300 text-sm font-medium mb-2" for="intro">
        Introduction
      </label>
      <textarea
        class="w-full px-4 py-3 rounded-lg bg-gray-900/60 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300"
        id="intro"
        rows="4"
        placeholder="Short introduction"
        formControlName="intro"></textarea>
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <label class="block text-slate-300 text-sm font-medium mb-2" for="photoUrl">
          Photo URL
        </label>
        <input
          class="w-full px-4 py-3 rounded-lg bg-gray-900/60 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300"
          id="photoUrl"
          type="text"
          placeholder="URL to your photo"
          formControlName="photoUrl">
      </div>
      
      <div>
        <label class="block text-slate-300 text-sm font-medium mb-2" for="ctaText">
          Call to Action Text
        </label>
        <input
          class="w-full px-4 py-3 rounded-lg bg-gray-900/60 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300"
          id="ctaText"
          type="text"
          placeholder="CTA button text"
          formControlName="ctaText">
      </div>
    </div>
    
    <div>
      <label class="block text-slate-300 text-sm font-medium mb-2" for="ctaTarget">
        Call to Action Target
      </label>
      <select
        class="w-full px-4 py-3 rounded-lg bg-gray-900/60 border border-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300"
        id="ctaTarget"
        formControlName="ctaTarget">
        <option value="projects">Projects</option>
        <option value="about">About</option>
        <option value="contact">Contact</option>
      </select>
    </div>
    
    <div class="flex items-center justify-between pt-4">
      <button
        class="bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-bold py-3 px-6 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition-all duration-300 transform hover:-translate-y-0.5 shadow-lg"
        type="submit"
        [disabled]="heroForm.invalid || !heroForm.dirty">
        Update Hero
      </button>
      
      <div *ngIf="isSubmitted && !submitError" class="text-green-400 flex items-center">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
        Hero section updated successfully!
      </div>
      
      <div *ngIf="submitError" class="text-red-400 flex items-center">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        Error updating hero section. Please try again.
      </div>
    </div>
  </form>
</div>
