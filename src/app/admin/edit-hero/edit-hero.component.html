<div class="min-h-screen bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 text-slate-100">
  <!-- Top Navigation Bar -->
  <nav class="bg-gray-800/50 backdrop-blur-lg border-b border-gray-700/50 px-6 py-4">
    <div class="flex items-center justify-between">
      <div class="flex items-center">
        <button routerLink="/admin/dashboard" class="p-2 rounded-lg hover:bg-gray-700/50 transition-colors mr-4">
          <svg class="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
          </svg>
        </button>
        <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">
          Edit Hero Section
        </h1>
      </div>
      <div class="flex items-center space-x-4">
        <button class="p-2 rounded-full hover:bg-gray-700/50 transition-colors">
          <svg class="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
          </svg>
        </button>
        <div class="flex items-center space-x-2">
          <div class="w-8 h-8 rounded-full bg-gradient-to-r from-blue-500 to-purple-500 flex items-center justify-center">
            <span class="text-xs font-bold">AP</span>
          </div>
          <span class="text-sm font-medium">Admin</span>
        </div>
      </div>
    </div>
  </nav>

  <div class="flex">
    <!-- Sidebar -->
    <aside class="w-64 bg-gray-800/30 backdrop-blur-lg border-r border-gray-700/50 min-h-screen hidden md:block">
      <div class="p-6">
        <h2 class="text-lg font-semibold text-slate-200 mb-6">Navigation</h2>
        <nav class="space-y-2">
          <a routerLink="/admin/dashboard" class="flex items-center space-x-3 px-4 py-3 rounded-lg text-slate-400 hover:bg-gray-700/50 hover:text-slate-200 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
            </svg>
            <span>Dashboard</span>
          </a>
          <a routerLink="/admin/hero" class="flex items-center space-x-3 px-4 py-3 rounded-lg bg-gradient-to-r from-blue-600/20 to-purple-600/20 text-blue-300 border border-blue-500/30">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
            <span>Hero Section</span>
          </a>
          <a routerLink="/admin/about" class="flex items-center space-x-3 px-4 py-3 rounded-lg text-slate-400 hover:bg-gray-700/50 hover:text-slate-200 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span>About Section</span>
          </a>
          <a routerLink="/admin/skills" class="flex items-center space-x-3 px-4 py-3 rounded-lg text-slate-400 hover:bg-gray-700/50 hover:text-slate-200 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span>Skills</span>
          </a>
          <a routerLink="/admin/projects" class="flex items-center space-x-3 px-4 py-3 rounded-lg text-slate-400 hover:bg-gray-700/50 hover:text-slate-200 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
            </svg>
            <span>Projects</span>
          </a>
          <a routerLink="/admin/experience" class="flex items-center space-x-3 px-4 py-3 rounded-lg text-slate-400 hover:bg-gray-700/50 hover:text-slate-200 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
            </svg>
            <span>Experience</span>
          </a>
          <a routerLink="/admin/education" class="flex items-center space-x-3 px-4 py-3 rounded-lg text-slate-400 hover:bg-gray-700/50 hover:text-slate-200 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222"></path>
            </svg>
            <span>Education</span>
          </a>
        </nav>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6">
      <div class="max-w-4xl mx-auto">
        <div class="bg-gray-800/40 backdrop-blur-lg rounded-xl p-8 border border-gray-700/50">
          <form (ngSubmit)="onSubmit()" [formGroup]="heroForm" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label class="block text-slate-300 text-sm font-medium mb-2" for="title">
                  Title
                </label>
                <input
                  class="w-full px-4 py-3 rounded-lg bg-gray-900/60 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300"
                  id="title"
                  type="text"
                  placeholder="Your name"
                  formControlName="title">
              </div>
              
              <div>
                <label class="block text-slate-300 text-sm font-medium mb-2" for="subtitle">
                  Subtitle
                </label>
                <input
                  class="w-full px-4 py-3 rounded-lg bg-gray-900/60 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300"
                  id="subtitle"
                  type="text"
                  placeholder="Your role"
                  formControlName="subtitle">
              </div>
            </div>
            
            <div>
              <label class="block text-slate-300 text-sm font-medium mb-2" for="intro">
                Introduction
              </label>
              <textarea
                class="w-full px-4 py-3 rounded-lg bg-gray-900/60 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300"
                id="intro"
                rows="4"
                placeholder="Short introduction"
                formControlName="intro"></textarea>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label class="block text-slate-300 text-sm font-medium mb-2" for="photoUrl">
                  Photo URL
                </label>
                <input
                  class="w-full px-4 py-3 rounded-lg bg-gray-900/60 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300"
                  id="photoUrl"
                  type="text"
                  placeholder="URL to your photo"
                  formControlName="photoUrl">
              </div>
              
              <div>
                <label class="block text-slate-300 text-sm font-medium mb-2" for="ctaText">
                  Call to Action Text
                </label>
                <input
                  class="w-full px-4 py-3 rounded-lg bg-gray-900/60 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300"
                  id="ctaText"
                  type="text"
                  placeholder="CTA button text"
                  formControlName="ctaText">
              </div>
            </div>
            
            <div>
              <label class="block text-slate-300 text-sm font-medium mb-2" for="ctaTarget">
                Call to Action Target
              </label>
              <select
                class="w-full px-4 py-3 rounded-lg bg-gray-900/60 border border-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300"
                id="ctaTarget"
                formControlName="ctaTarget">
                <option value="projects">Projects</option>
                <option value="about">About</option>
                <option value="contact">Contact</option>
              </select>
            </div>
            
            <div class="flex items-center justify-between pt-4">
              <button
                class="bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-bold py-3 px-6 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition-all duration-300 transform hover:-translate-y-0.5 shadow-lg"
                type="submit"
                [disabled]="heroForm.invalid || !heroForm.dirty">
                Update Hero
              </button>
              
              <div *ngIf="isSubmitted && !submitError" class="text-green-400 flex items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
                Hero section updated successfully!
              </div>
              
              <div *ngIf="submitError" class="text-red-400 flex items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                Error updating hero section. Please try again.
              </div>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>
</div>
