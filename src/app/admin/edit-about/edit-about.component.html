<div class="bg-gray-800/40 backdrop-blur-lg rounded-xl p-4 sm:p-6 border border-gray-700/50">
  <form (ngSubmit)="onSubmit()" [formGroup]="aboutForm" class="space-y-4 sm:space-y-6">
    <div>
      <label class="block text-slate-300 text-xs sm:text-sm font-medium mb-1 sm:mb-2" for="title">
        Title
      </label>
      <input
        class="w-full px-3 py-2 sm:px-4 sm:py-3 rounded-lg bg-gray-900/60 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300 text-sm sm:text-base"
        id="title"
        type="text"
        placeholder="Section title"
        formControlName="title">
    </div>
    
    <div>
      <label class="block text-slate-300 text-xs sm:text-sm font-medium mb-1 sm:mb-2" for="content">
        Content
      </label>
      <textarea
        class="w-full px-3 py-2 sm:px-4 sm:py-3 rounded-lg bg-gray-900/60 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300 text-sm sm:text-base"
        id="content"
        rows="6"
        placeholder="About section content"
        formControlName="content"></textarea>
    </div>
    
    <div>
      <label class="block text-slate-300 text-xs sm:text-sm font-medium mb-1 sm:mb-2" for="profilePhotoUrl">
        Profile Photo URL
      </label>
      <input
        class="w-full px-3 py-2 sm:px-4 sm:py-3 rounded-lg bg-gray-900/60 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300 text-sm sm:text-base"
        id="profilePhotoUrl"
        type="text"
        placeholder="URL to your profile photo"
        formControlName="profilePhotoUrl">
    </div>
    
    <!-- Skills Section -->
    <div>
      <div class="flex justify-between items-center mb-3">
        <label class="block text-slate-300 text-xs sm:text-sm font-medium">
          Skills
        </label>
        <button 
          type="button" 
          (click)="addSkill()"
          class="text-xs sm:text-sm bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded-lg transition-colors duration-300">
          Add Skill
        </button>
      </div>
      
      <div formArrayName="skills" class="space-y-3">
        <div 
          *ngFor="let skillGroup of skills.controls; let i = index" 
          [formGroupName]="i"
          class="p-3 bg-gray-900/40 rounded-lg border border-gray-700">
          <div class="flex justify-between items-center mb-2">
            <span class="text-slate-300 text-xs sm:text-sm font-medium">Skill {{ i + 1 }}</span>
            <button 
              type="button" 
              (click)="removeSkill(i)"
              class="text-red-400 hover:text-red-300 text-xs">
              Remove
            </button>
          </div>
          <div class="space-y-2">
            <input
              class="w-full px-3 py-2 rounded-lg bg-gray-800/60 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300 text-xs sm:text-sm"
              type="text"
              placeholder="Skill name"
              formControlName="name">
            <textarea
              class="w-full px-3 py-2 rounded-lg bg-gray-800/60 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300 text-xs sm:text-sm"
              rows="2"
              placeholder="Skill description"
              formControlName="description"></textarea>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Stats Section -->
    <div formGroupName="stats">
      <label class="block text-slate-300 text-xs sm:text-sm font-medium mb-2">
        Experience Stats
      </label>
      
      <div class="space-y-3">
        <div>
          <label class="block text-slate-400 text-xs mb-1">Years of Experience</label>
          <input
            class="w-full px-3 py-2 rounded-lg bg-gray-900/60 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300 text-xs sm:text-sm"
            type="text"
            placeholder="e.g., 5+ Years Experience"
            formControlName="experience">
        </div>
        
        <div>
          <label class="block text-slate-400 text-xs mb-1">Completed Projects</label>
          <input
            class="w-full px-3 py-2 rounded-lg bg-gray-900/60 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300 text-xs sm:text-sm"
            type="text"
            placeholder="e.g., 20+ Projects Completed"
            formControlName="projects">
        </div>
        
        <div>
          <label class="block text-slate-400 text-xs mb-1">Client Satisfaction</label>
          <input
            class="w-full px-3 py-2 rounded-lg bg-gray-900/60 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300 text-xs sm:text-sm"
            type="text"
            placeholder="e.g., 100% Client Satisfaction"
            formControlName="satisfaction">
        </div>
      </div>
    </div>
    
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between pt-4 gap-3">
      <button
        class="w-full sm:w-auto bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-bold py-2 sm:py-3 px-4 sm:px-6 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition-all duration-300 transform hover:-translate-y-0.5 shadow-lg text-sm sm:text-base"
        type="submit"
        [disabled]="aboutForm.invalid || !aboutForm.dirty">
        Update About Section
      </button>
      
      <div *ngIf="isSubmitted && !submitError" class="text-green-400 flex items-center text-sm">
        <svg class="w-4 h-4 sm:w-5 sm:h-5 mr-1 sm:mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
        About section updated successfully!
      </div>
      
      <div *ngIf="submitError" class="text-red-400 flex items-center text-sm">
        <svg class="w-4 h-4 sm:w-5 sm:h-5 mr-1 sm:mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        Error updating about section. Please try again.
      </div>
    </div>
  </form>
</div>
