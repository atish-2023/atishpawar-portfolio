<div class="container mx-auto px-4 py-8">
  <h1 class="text-3xl font-bold mb-6">Edit About Section</h1>
  
  <form (ngSubmit)="onSubmit()" [formGroup]="aboutForm" class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4">
    <div class="mb-4">
      <label class="block text-gray-700 text-sm font-bold mb-2" for="title">
        Title
      </label>
      <input
        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
        id="title"
        type="text"
        placeholder="Section title"
        formControlName="title">
    </div>
    
    <div class="mb-4">
      <label class="block text-gray-700 text-sm font-bold mb-2" for="content">
        Content
      </label>
      <textarea
        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
        id="content"
        rows="6"
        placeholder="About section content"
        formControlName="content"></textarea>
    </div>
    
    <div class="mb-4">
      <label class="block text-gray-700 text-sm font-bold mb-2" for="photoUrl">
        Photo URL
      </label>
      <input
        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
        id="photoUrl"
        type="text"
        placeholder="URL to your photo"
        formControlName="photoUrl">
    </div>
    
    <div class="flex items-center justify-between">
      <button
        class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
        type="submit"
        [disabled]="aboutForm.invalid || !aboutForm.dirty">
        Update About
      </button>
      <div 
        class="text-green-500 text-sm" 
        *ngIf="isSubmitted && !submitError">
        About section updated successfully!
      </div>
      <div 
        class="text-red-500 text-sm" 
        *ngIf="submitError">
        Error updating about section. Please try again.
      </div>
    </div>
  </form>
</div>
